[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "research-toolkit"
version = "0.0.0.dev0"
description = "Auditable, notebook-friendly quantitative trading research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["polars>=1.30,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plot = ["matplotlib>=3.9,<4"]
calendar = ["exchange_calendars>=4.5,<5"]
notebook = ["matplotlib>=3.9,<4", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
